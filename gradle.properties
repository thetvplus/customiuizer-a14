# Local build defaults; JDK 25 is pinned in gradle/gradle-daemon-jvm.properties.
android.nonTransitiveRClass=true
android.injected.testOnly=false
org.gradle.jvmargs=-Xmx2048M -XX:+UseParallelGC -Dkotlin.daemon.jvm.options\="-Xmx2048M"
android.enableJetifier=false
android.useAndroidX=true
org.gradle.configuration-cache=true
org.gradle.caching=true
# The host compiler is upgraded separately; keep the APK's runtime at the catalog version.
kotlin.stdlib.default.dependency=false
android.nonFinalResIds=true
