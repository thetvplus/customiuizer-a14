name: A14 Signed Build
run-name: A14 Signed Build / ${{ github.ref_name }} / ${{ github.sha }}

on:
  workflow_dispatch:
  # Register this workflow while it is reviewed on the authorized task branch.
  # Push only validates the workflow contract; it can never enter the signing job.
  push:
    branches: [codex/a14-feature-refinement-20261019]
    paths: [.github/workflows/a14-signed-build.yml]

permissions:
  contents: read

concurrency:
  group: a14-signed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      authorized: ${{ steps.source.outputs.authorized }}
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install CI parser
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Check workflow contracts
        run: python tools/ci_contract_scan.py --expected-branch main
      - name: Authorize native ref
        id: source
        if: github.event_name == 'workflow_dispatch'
        run: python tools/signed_release.py source-policy
      - name: Look for trusted CI on this exact SHA
        id: ci
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/signed_release.py ci-status
      - name: Set up JDK 25
        if: github.event_name == 'workflow_dispatch' && steps.ci.outputs.reuse != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          force-download: true
          verify-signature: true
      - name: Set up Android SDK
        if: github.event_name == 'workflow_dispatch' && steps.ci.outputs.reuse != 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK packages
        if: github.event_name == 'workflow_dispatch' && steps.ci.outputs.reuse != 'true'
        run: bash tools/ci_install_android_sdk.sh
      - name: Set up Gradle
        if: github.event_name == 'workflow_dispatch' && steps.ci.outputs.reuse != 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Source, tools, JVM tests and lint
        if: github.event_name == 'workflow_dispatch' && steps.ci.outputs.reuse != 'true'
        run: |
          python tools/check_ci_portability.py
          python tools/brutal_test_runner.py --config tools/brutal_test_config.json hermeticity
          python tools/verify.py full
      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-build-validation-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  sign:
    name: Build, sign and verify Release
    needs: validate
    if: github.repository == 'thetvplus/customiuizer-a14' && github.event_name == 'workflow_dispatch' && needs.validate.outputs.authorized == 'true'
    environment: release-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          force-download: true
          verify-signature: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK packages
        run: bash tools/ci_install_android_sdk.sh
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Build the official APK once
        env:
          A14_KEYSTORE_BASE64: ${{ secrets.A14_KEYSTORE_BASE64 }}
          A14_STORE_PASSWORD: ${{ secrets.A14_STORE_PASSWORD }}
          A14_KEY_ALIAS: ${{ secrets.A14_KEY_ALIAS }}
          A14_KEY_PASSWORD: ${{ secrets.A14_KEY_PASSWORD }}
          CUSTOMIUIZER_A14_KEYSTORE_PROPERTIES: ${{ runner.temp }}/a14-signing/keystore.properties
        run: |
          trap 'rm -rf -- "$RUNNER_TEMP/a14-signing"' EXIT
          python tools/signed_release.py prepare-signing
          ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease :app:lintVitalRelease -PofficialRelease=true -PrequireBuildRevision=true -PbuildRevision="${GITHUB_SHA:0:8}"
      - name: Remove temporary signing material
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/a14-signing"
      - name: Verify APK and record candidate metadata
        run: python tools/signed_release.py candidate --directory "$RUNNER_TEMP/candidate"
      - name: Attest the final signed APK and its metadata
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/candidate/*.apk
            ${{ runner.temp }}/candidate/build-metadata.json
          create-storage-record: false
      - name: Verify GitHub attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION_BUNDLE" "$RUNNER_TEMP/candidate/attestation.sigstore.json"
          python tools/signed_release.py attest --directory "$RUNNER_TEMP/candidate"
      - name: Upload verified signed candidate
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a14-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Summarize verified candidate
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'candidate/build-metadata.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"### Verified signed APK\n\n{data['version_name']} ({data['version_code']})\n\nSource: `{data['source_sha']}`\n\nAPK SHA-256: `{data['apk_sha256']}`\n\nAndroid signature and GitHub provenance passed. [Download artifact]({os.environ['ARTIFACT_URL']}). No Release or tag created.\n")
          PY
