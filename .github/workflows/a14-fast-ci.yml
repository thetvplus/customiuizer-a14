name: A14 Fast CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a14-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          force-download: true
          verify-signature: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android SDK packages
        run: bash tools/ci_install_android_sdk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-cleanup: on-success

      - name: CI portability
        run: python tools/check_ci_portability.py

      - name: Brutal config validation
        run: python tools/brutal_test_runner.py --config tools/brutal_test_config.json validate

      - name: Require clean tracked tree before hermeticity
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::Tracked working tree changed before hermeticity"
            git diff --name-status
            git diff
            exit 1
          fi

      # Hermeticity runs all Python tests and governance commands once, with
      # diagnostics, while also checking that they leave tracked files intact.
      - name: Python and governance checks with hermeticity
        run: |
          python tools/brutal_test_runner.py --config tools/brutal_test_config.json hermeticity
          python tools/brutal_test_runner.py --config tools/brutal_test_config.json determinism

      - name: Full machine verifier
        run: python tools/verify.py full

      - name: Safe debug and develop builds
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDevelop

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-ci-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
