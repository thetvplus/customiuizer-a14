name: A14 Full CI

on:
  push:
    branches:
      - devin/a14-rom-intelligence-audit
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a14-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        contains(github.event.head_commit.message || '', '[full-ci]')
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Resolve and install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail

          SDK_LIST="$(sdkmanager --list --channel=0)"

          PLATFORM_PACKAGE="$(
            printf '%s\n' "$SDK_LIST" |
              awk -F'|' '
                /^[ \t]*platforms;android-37(\.[0-9]+)?[ \t]*\|/ ||
                /^[ \t]*platforms;android-CinnamonBun[ \t]*\|/ {
                  gsub(/^[ \t]+|[ \t]+$/, "", $1)
                  print $1
                }
              ' |
              sort -V |
              tail -n 1
          )"

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "::error::No Android 17 / API 37 platform package is available"
            printf '%s\n' "$SDK_LIST" | grep -E 'platforms;android-(37(\.[0-9]+)?|CinnamonBun)' || true
            exit 1
          fi

          BUILD_TOOLS_PACKAGE="$(
            printf '%s\n' "$SDK_LIST" |
              awk -F'|' '
                /build-tools;37\./ {
                  gsub(/^[ \t]+|[ \t]+$/, "", $1)
                  print $1
                }
              ' |
              sort -V |
              tail -n 1
          )"

          if [ -z "$BUILD_TOOLS_PACKAGE" ]; then
            echo "::error::No Android SDK Build-Tools 37.x package is available"
            printf '%s\n' "$SDK_LIST" | grep -E 'build-tools;37\.' || true
            exit 1
          fi

          echo "Resolved platform: $PLATFORM_PACKAGE"
          echo "Resolved build tools: $BUILD_TOOLS_PACKAGE"

          sdkmanager --channel=0 "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE"

          PLATFORM_DIR="$(find "$ANDROID_SDK_ROOT/platforms" -maxdepth 1 -type d \( -name 'android-37*' -o -name 'android-CinnamonBun' \) | head -n 1)"
          if [ -z "$PLATFORM_DIR" ] || [ ! -f "$PLATFORM_DIR/android.jar" ]; then
            echo "::error::API 37 platform installed but android.jar not found"
            ls -R "$ANDROID_SDK_ROOT/platforms" || true
            exit 1
          fi
          echo "Installed platform dir: $PLATFORM_DIR"

          BUILD_TOOLS_DIR="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 1 -type d -name '37*' | head -n 1)"
          if [ -z "$BUILD_TOOLS_DIR" ] || [ ! -x "$BUILD_TOOLS_DIR/aapt" ]; then
            echo "::error::Build-Tools 37.x installed but aapt not found"
            ls -R "$ANDROID_SDK_ROOT/build-tools" || true
            exit 1
          fi
          echo "Installed build-tools dir: $BUILD_TOOLS_DIR"

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: CI portability
        run: python tools/check_ci_portability.py

      - name: Python tool tests
        run: python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Static governance checks
        run: |
          python tools/check-invariants.py
          python tools/check_automation_state.py
          python tools/check_document_contracts.py
          python tools/check_goal_constitution.py
          python tools/progress_snapshot.py --check

      - name: Full machine verifier
        run: python tools/verify.py full

      - name: First clean develop build
        run: |
          ./gradlew --no-daemon clean :app:assembleDevelop
          cp app/build/outputs/apk/develop/*.apk first-develop.apk

      - name: Second clean develop build
        run: |
          ./gradlew --no-daemon clean :app:assembleDevelop
          cp app/build/outputs/apk/develop/*.apk second-develop.apk

      - name: APK semantic diff
        run: python tools/apk_semantic_diff.py --require-reproducible first-develop.apk second-develop.apk

      - name: Brutal test suite
        run: python tools/brutal_test_runner.py --config tools/brutal_test_config.json all

      - name: R8 lint on develop
        run: ./gradlew --no-daemon :app:lintVitalDevelop

      - name: Upload develop artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: develop-apk-and-mapping
          path: |
            app/build/outputs/apk/develop/*.apk
            app/build/outputs/mapping/develop/mapping.txt
            app/build/outputs/mapping/develop/usage.txt
            app/build/outputs/mapping/develop/configuration.txt
          if-no-files-found: ignore
