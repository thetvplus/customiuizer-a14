name: A14 Full CI

on:
  push:
    branches:
      - main
    tags:
      - 'r14.*'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'gradle/**'
      - 'gradlew*'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'app/build.gradle.kts'
      - 'app/proguard-rules.pro'
      - 'tools/**'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a14-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'push' &&
        (
          startsWith(github.ref, 'refs/tags/r14.') ||
          contains(github.event.head_commit.message || '', '[full-ci]')
        )
      )

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          force-download: true
          verify-signature: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android SDK packages
        run: bash tools/ci_install_android_sdk.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-cleanup: on-success

      - name: CI portability
        run: python tools/check_ci_portability.py

      # Run the Python/governance commands only inside their hermeticity gate.
      # Independent mutations verify that the gates actually reject defects.
      - name: Python, governance and independent mutation gates
        run: python tools/brutal_test_runner.py --config tools/brutal_test_config.json all

      - name: Tag release metadata
        if: startsWith(github.ref, 'refs/tags/r14.')
        run: python tools/check_release_metadata.py --require-tag

      - name: Full machine verifier
        run: python tools/verify.py full

      - name: Preserve verifier reports before clean builds
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/a14-ci-reports"
          for directory in app/build/reports app/build/test-results; do
            if [ -d "$directory" ]; then
              cp -R "$directory" "$RUNNER_TEMP/a14-ci-reports/"
            fi
          done

      # Neither build may restore compiled outputs from the Gradle build cache.
      # Separate Gradle processes also avoid sharing compiler state.
      - name: First clean develop build
        run: |
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false clean :app:assembleDevelop
          cp app/build/outputs/apk/develop/*.apk "$RUNNER_TEMP/first-develop.apk"
          test -s app/build/outputs/mapping/develop/mapping.txt
          cp app/build/outputs/mapping/develop/mapping.txt "$RUNNER_TEMP/first-mapping.txt"

      - name: Second clean develop build and fatal lint
        run: |
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache -Pkotlin.compiler.execution.strategy=in-process -Pkotlin.incremental=false clean :app:assembleDevelop :app:lintVitalDevelop
          cp app/build/outputs/apk/develop/*.apk "$RUNNER_TEMP/second-develop.apk"

      - name: APK content and R8 mapping reproducibility
        run: |
          python tools/apk_semantic_diff.py --require-reproducible --json-output "$RUNNER_TEMP/apk-semantic-diff.json" "$RUNNER_TEMP/first-develop.apk" "$RUNNER_TEMP/second-develop.apk"
          cmp "$RUNNER_TEMP/first-mapping.txt" app/build/outputs/mapping/develop/mapping.txt

      - name: Require develop inspection files
        run: |
          test -s app/build/outputs/mapping/develop/mapping.txt
          test -f app/build/outputs/mapping/develop/usage.txt
          test -s app/build/outputs/mapping/develop/configuration.txt

      - name: Upload develop artifacts for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: develop-apk-and-mapping
          path: |
            app/build/outputs/apk/develop/*.apk
            app/build/outputs/mapping/develop/mapping.txt
            app/build/outputs/mapping/develop/usage.txt
            app/build/outputs/mapping/develop/configuration.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-ci-diagnostics
          path: |
            ${{ runner.temp }}/a14-ci-reports/
            ${{ runner.temp }}/apk-semantic-diff.json
            ${{ runner.temp }}/first-mapping.txt
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
